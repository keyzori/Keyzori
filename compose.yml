x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keyzori
      POSTGRES_DB: keyzori
      POSTGRES_PASSWORD: ${KEYZORI_POSTGRES_PASSWORD:?Set KEYZORI_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pg_stat_statements -c max_connections=200"
    volumes: ["postgres-data:/var/lib/postgresql"]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyzori -d keyzori"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    image: ghcr.io/keyzori/keyzori:latest
    build: .
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      KEYZORI_DATABASE_URL: postgresql://keyzori:${KEYZORI_POSTGRES_PASSWORD:?Set KEYZORI_POSTGRES_PASSWORD}@postgres:5432/keyzori
      KEYZORI_REDIS_URL: redis://redis:6379
      KEYZORI_ADMIN_KEY: ${KEYZORI_ADMIN_KEY:?Set KEYZORI_ADMIN_KEY}
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6284:6284"
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
