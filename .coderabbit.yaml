# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-AU"
tone_instructions: >-
  Be concise and prioritise correctness, security, compatibility, and regressions.
  Avoid style feedback already enforced by Biome.

reviews:
  profile: "assertive"
  high_level_summary: true
  high_level_summary_instructions: >-
    Briefly state the behaviour change, verification performed, and any security,
    compatibility, migration, or operational impact.
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  path_filters:
    - "!.github/assets/**"
    - "!drizzle/**/snapshot.json"
  path_instructions:
    - path: "src/domain/**"
      instructions: |
        Keep domain code independent of Drizzle, Redis, Elysia, Commander, and Stripe.
        Flag weakened licensing invariants, invalid state transitions, or lossy type changes.
    - path: "src/application/**"
      instructions: |
        Prioritise license, authentication, session, and metering correctness.
        Verify atomicity, idempotency, concurrency controls, session invalidation, and secret redaction.
    - path: "src/controllers/**"
      instructions: |
        Check authentication, authorisation, rate limits, proxy-derived client identity, input bounds, and response redaction.
        Flag HTTP contract changes that are not reflected in validation, OpenAPI, CLI behaviour, tests, and the TypeScript SDK.
    - path: "src/cli/**"
      instructions: |
        Keep operator CLI behaviour aligned with the admin HTTP API.
        Check safe secret display, actionable errors, exit behaviour, parsing, and backward compatibility.
    - path: "src/infrastructure/**"
      instructions: |
        Check PostgreSQL queries and Redis scripts for tenant/license scoping, atomicity, race conditions, TTL handling, and token binding.
        Do not accept application rules leaking into infrastructure implementations.
    - path: "src/integrations/stripe/**"
      instructions: |
        Verify exact-body webhook signatures, durable idempotency, retry safety, current-state reconciliation, and independent billing/manual revocation.
        Flag secret or customer-data exposure and partial updates without recovery behaviour.
    - path: "src/db/**"
      instructions: |
        Require schema changes to preserve constraints and existing data, and to include a generated, reviewed migration.
        Flag destructive or non-transactional migration behaviour without an explicit operational plan.
    - path: "drizzle/**/migration.sql"
      instructions: |
        Review SQL for data loss, unsafe locks, missing backfills, constraint-ordering mistakes, downgrade implications, and schema drift.
    - path: "**/*.test.ts"
      instructions: |
        Require regression coverage for changed behaviour and meaningful assertions using bun:test.
        For security-sensitive or stateful changes, include retries, concurrency, boundary values, and dependency-failure paths.
    - path: ".github/workflows/**"
      instructions: |
        Require immutable action pins, least-privilege permissions, locked Bun installs, bounded jobs, and safe secret handling.
        Preserve Release Please, tag/version alignment, canary publishing, artifact smoke tests, and protected-main behaviour.
    - path: "scripts/{release,releaseManifests,syncVersions,tag,verifyRelease}.ts"
      instructions: |
        Keep root metadata, changelog, Git tags, GitHub Releases, and published image versions aligned.
        Flag non-idempotent release operations or changes that can publish from the wrong commit.
    - path: "Dockerfile"
      instructions: |
        Preserve the non-root, read-only, minimal single-binary runtime and health checks.
        Flag unpinned images, leaked build secrets, unnecessary files, or weakened container isolation.
    - path: "*docker-compose.yml"
      instructions: |
        Preserve the non-root, read-only, minimal single-binary runtime and health checks.
        Flag unpinned images, leaked build secrets, unnecessary files, or weakened container isolation.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/*.md"
  learnings:
    scope: "local"
  automatic_linking_mode: "disabled"
  linked_repositories:
    - repository: "keyzori/typescript-sdk"
      instructions: >-
        The private TypeScript SDK and compatibility suite define the client side of
        Keyzori's public HTTP contract. Use it to identify breaking or unsynchronised
        endpoint, payload, validation, and error changes.

chat:
  art: false
