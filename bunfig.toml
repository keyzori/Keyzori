[install]
exact = true
saveTextLockfile = true

[test]
coverageSkipTestFiles = true
timeout = 20000

[lint]
ignorePatterns = ["node_modules/", "dist/", ".cache/"]

[fmt]
printWidth = 80
semi = true
singleQuote = false
trailingComma = "all"
sortImports = false
sortPackageJson = false
ignorePatterns = [
  "node_modules/",
  "dist/",
  ".cache/",
  "src/core/database/migrations/",
  ".release-please-manifest.json",
  "renovate.json",
]
