name: keyzori

services:
  server:
    image: ghcr.io/keyzori/server:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KEYZORI_ADMIN_PASS: ${KEYZORI_ADMIN_PASS:?Set KEYZORI_ADMIN_PASS in .env}
      KEYZORI_DATABASE_URL: "postgresql://keyzori:${KEYZORI_POSTGRES_PASS:?Set KEYZORI_POSTGRES_PASS in .env}@postgres:5432/keyzori"
      KEYZORI_REDIS_URL: redis://redis:6379
      KEYZORI_SERVER_HOST: 0.0.0.0
      KEYZORI_SERVER_PORT: 3000
    ports:
      - "127.0.0.1:${KEYZORI_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: keyzori
      POSTGRES_PASSWORD: ${KEYZORI_POSTGRES_PASS:?Set KEYZORI_POSTGRES_PASS in .env}
      POSTGRES_USER: keyzori
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyzori -d keyzori"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
