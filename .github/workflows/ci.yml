name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}
  docker:
    name: Docker (final gate)
    needs: checks
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.sha }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
