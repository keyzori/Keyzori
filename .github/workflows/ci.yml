name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}
  docker:
    name: Container verification
    needs: checks
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.sha }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [checks, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful verification
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINER_RESULT: ${{ needs.docker.result }}
        shell: bash
        run: |
          if [[ "${CHECKS_RESULT}" != "success" || "${CONTAINER_RESULT}" != "success" ]]; then
            echo "Checks: ${CHECKS_RESULT}"
            echo "Container verification: ${CONTAINER_RESULT}"
            exit 1
          fi
