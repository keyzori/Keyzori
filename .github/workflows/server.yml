name: Server
on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  required:
    name: Required checks
    needs: [workflows, verify, binaries]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require workflows, Linux checks and native packages
        env:
          WORKFLOW_RESULT: ${{ needs.workflows.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BINARY_RESULT: ${{ needs.binaries.result }}
        run: |
          test "$WORKFLOW_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$BINARY_RESULT" = success

  workflows:
    name: Workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflows with actionlint 1.7.12
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  binaries:
    name: Native packages
    uses: ./.github/workflows/binaries.yml
    with:
      ref: ${{ github.sha }}

  verify:
    name: Linux checks (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun src/scripts/test-services.ts exec bun src/scripts/artifact-smoke.ts source
      - run: docker build -f src/Dockerfile -t keyzori-server:test .
      - run: bun src/scripts/test-services.ts exec bun src/scripts/container-smoke.ts image
      - run: bun src/scripts/compose-smoke.ts
      - if: always()
        run: bun src/scripts/test-services.ts stop
