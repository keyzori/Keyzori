name: Docker
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release-tag:
        required: true
        type: string
      release-id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      record: ${{ steps.plan.outputs.record }}
    env:
      SOURCE_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.release-tag }}
      RELEASE_ID: ${{ inputs.release-id }}
    steps:
      - name: Validate the release revision before checkout
        id: trust
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_REVISION: ${{ inputs.ref }}
        with:
          script: |
            const revision = process.env.REQUESTED_REVISION;
            if (!/^[a-f0-9]{40}$/.test(revision))
              throw new Error('Release builds require an immutable commit SHA');
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${revision}...${main.object.sha}`
            });
            if (data.base_commit.sha !== revision || !['ahead', 'identical'].includes(data.status))
              throw new Error('Release revision is not an ancestor of main');
      # Publication helpers come from the trusted workflow revision, even on recovery.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/release-images.ts plan

  image:
    name: Test and push ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.record == ''
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HUSKY: "0"
      SOURCE_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build source runtime once
        run: |
          docker build --load --provenance=false --sbom=false -f src/Dockerfile -t keyzori-server:test \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" .
          echo "KZ_SMOKE_IMAGE_ID=$(docker image inspect --format '{{.Id}}' keyzori-server:test)" >> "$GITHUB_ENV"
      - name: Smoke test the image
        run: bun run smoke:container
      - name: Verify Compose deployment
        run: bun run smoke:compose
      - name: Give the SBOM scanner a local name for the tested ID
        run: docker tag "$KZ_SMOKE_IMAGE_ID" "keyzori-sbom:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Inventory the exact tested image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: docker:keyzori-sbom:${{ github.run_id }}-${{ github.run_attempt }}
          format: spdx-json
          syft-version: v1.57.0
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the tested image and record its digest
        id: tested
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${OWNER,,}/server"
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag "$KZ_SMOKE_IMAGE_ID" "$image:$tag"
          docker push "$image:$tag"
          mkdir -p digests
          digest="$(docker image inspect --format '{{json .RepoDigests}}' "$image:$tag" |
            jq -er --arg prefix "$image@" '[.[] | select(startswith($prefix)) | ltrimstr($prefix)] | unique |
              if length == 1 then .[0] else error("ambiguous pushed digest") end | select(test("^sha256:[a-f0-9]{64}$"))')"
          printf '%s@%s\n' "$image" "$digest" > "digests/${ARCH}.txt"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record checked source and runtime provenance
        env:
          IMAGE_DIGEST: ${{ steps.tested.outputs.digest }}
          TARGET_ARCH: ${{ matrix.arch }}
          PUBLICATION_WORKFLOW_SHA: ${{ github.sha }}
        run: bun src/scripts/image-provenance.ts
      - name: Attest the tested digest and explicit source commit
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-name: ${{ steps.tested.outputs.name }}
          subject-digest: ${{ steps.tested.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: image.provenance.json
          push-to-registry: true
      - name: Attest the image inventory
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-name: ${{ steps.tested.outputs.name }}
          subject-digest: ${{ steps.tested.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-evidence-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            image.spdx.json
            image.provenance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-digest-${{ matrix.arch }}
          overwrite: true
          path: digests/*.txt
          if-no-files-found: error

  record:
    needs: [plan, image]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.image.result == 'success' || (needs.image.result == 'skipped' && needs.plan.outputs.record != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    outputs:
      record: ${{ steps.checkpoint.outputs.record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.image.result == 'success'
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: digests
      - name: Persist or revalidate the attested native digest pair on the draft
        id: checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release-id }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ inputs.ref }}
          PLANNED_RECORD: ${{ needs.plan.outputs.record }}
        run: bun .github/scripts/release-images.ts record

  publish:
    needs: record
    if: "!cancelled() && needs.record.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify signed source, native architecture and inventory for the recorded pair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_RECORD: ${{ needs.record.outputs.record }}
          SOURCE_SHA: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            digest="$(jq -er --arg arch "$arch" '.[$arch]' <<< "$TESTED_RECORD")"
            artifact="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/server@$digest"
            trust=(--repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/docker.yml" --source-ref refs/heads/main --deny-self-hosted-runners)
            gh attestation verify "$artifact" "${trust[@]}" --predicate-type https://slsa.dev/provenance/v1 --format json |
              jq -e --arg sha "$SOURCE_SHA" --arg tag "$RELEASE_TAG" --arg arch "linux/$arch" --arg digest "$digest" \
                'any(.[].verificationResult.statement.predicate.buildDefinition.externalParameters;
                  .source == $sha and .releaseTag == $tag and .platform == $arch and .imageDigest == $digest)' > /dev/null
            gh attestation verify "$artifact" "${trust[@]}" --predicate-type https://spdx.dev/Document/v2.3 > /dev/null
          done
      - name: Create missing aliases and verify exact index and native digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release-id }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ inputs.ref }}
          TESTED_RECORD: ${{ needs.record.outputs.record }}
        run: bun .github/scripts/release-images.ts promote
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-server-images-${{ github.run_attempt }}
          path: published-images
          if-no-files-found: error
