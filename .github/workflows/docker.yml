name: Docker
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release-tag:
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  image:
    name: Test and push ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HUSKY: "0"
      SOURCE_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build binary runtime once
        run: |
          docker build -f src/Dockerfile -t keyzori-server:test \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" .
      - name: Smoke test the image
        run: bun src/scripts/test-services.ts exec bun src/scripts/container-smoke.ts image
      - name: Verify Compose deployment
        run: bun src/scripts/compose-smoke.ts
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the tested image and record its digest
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${OWNER,,}/server"
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag keyzori-server:test "$image:$tag"
          docker push "$image:$tag"
          mkdir -p digests
          docker inspect --format '{{json .RepoDigests}}' "$image:$tag" \
            | jq -er --arg image "$image" '.[] | select(startswith($image + "@sha256:"))' \
            > "digests/${ARCH}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/*.txt
          if-no-files-found: error
      - if: always()
        run: bun src/scripts/test-services.ts stop

  publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/server" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.release-tag }}
            type=semver,pattern={{version}},value=${{ inputs.release-tag }}
          flavor: |
            latest=${{ !contains(inputs.release-tag, '-') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-platform tags from tested digests
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"
      - name: Verify published release tags and platforms
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          expected=""
          count=0
          mkdir -p published-images
          while IFS= read -r tag; do
            if [[ -z "$tag" ]]; then continue; fi
            manifest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')"
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' \
              <<< "$manifest" > /dev/null
            digest="$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' <<< "$manifest")"
            if [[ -z "$expected" ]]; then expected="$digest"; else test "$digest" = "$expected"; fi
            count=$((count + 1))
            printf '%s\n' "$manifest" > "published-images/${count}.json"
            printf '%s %s\n' "$tag" "$digest" | tee -a published-images/tags.txt
          done <<< "$TAGS"
          test "$count" -gt 0
          cat published-images/tags.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-server-images
          path: published-images
          if-no-files-found: error
