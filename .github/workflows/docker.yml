name: Docker
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ""
jobs:
  image:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Build runtime image once
        shell: bash
        run: |
          docker build --tag keyzori-rebuild \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" .
      - name: Smoke test the built image
        run: bun run docker:smoke
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("canary" "${SOURCE_SHA}")
          if [[ -n "${RELEASE_TAG}" ]]; then
            tags=("${RELEASE_TAG}")
            if [[ "${RELEASE_TAG}" != *-* ]]; then tags+=("latest"); fi
          fi
          for tag in "${tags[@]}"; do
            docker tag keyzori-rebuild "${image}:${tag}"
            docker push "${image}:${tag}"
          done
      - name: Create GitHub release after successful publication
        if: inputs.publish && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            args=(--generate-notes --title "${RELEASE_TAG}" --verify-tag --target "${SOURCE_SHA}")
            if [[ "${RELEASE_TAG}" == *-* ]]; then args+=(--prerelease); fi
            gh release create "${RELEASE_TAG}" "${args[@]}"
          fi
