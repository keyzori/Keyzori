name: Docker
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release-tag:
        required: true
        type: string
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  image:
    name: Test and push ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HUSKY: "0"
      SOURCE_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - name: Validate the release revision before checkout
        id: trust
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_REVISION: ${{ inputs.ref }}
        with:
          script: |
            const revision = process.env.REQUESTED_REVISION;
            if (!/^[a-f0-9]{40}$/.test(revision))
              throw new Error('Release builds require an immutable commit SHA');
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${revision}...${main.object.sha}`
            });
            if (data.base_commit.sha !== revision || !['ahead', 'identical'].includes(data.status))
              throw new Error('Release revision is not an ancestor of main');
            core.setOutput('revision', revision);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trust.outputs.revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build source runtime once
        run: |
          docker build -f src/Dockerfile -t keyzori-server:test \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" .
      - name: Smoke test the image
        run: bun run smoke:container
      - name: Verify Compose deployment
        run: bun run smoke:compose
      - name: Inventory the exact tested image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: docker:keyzori-server:test
          format: spdx-json
          syft-version: v1.57.0
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the tested image and record its digest
        id: tested
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${OWNER,,}/server"
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag keyzori-server:test "$image:$tag"
          docker push "$image:$tag"
          mkdir -p digests
          docker inspect --format '{{json .RepoDigests}}' "$image:$tag" \
            | jq -er --arg image "$image" '.[] | select(startswith($image + "@sha256:"))' \
            > "digests/${ARCH}.txt"
          digest="$(cut -d@ -f2 "digests/${ARCH}.txt")"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record checked source and runtime provenance
        env:
          IMAGE_DIGEST: ${{ steps.tested.outputs.digest }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bun src/scripts/image-provenance.ts
      - name: Attest the tested digest and explicit source commit
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-name: ${{ steps.tested.outputs.name }}
          subject-digest: ${{ steps.tested.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: image.provenance.json
          push-to-registry: true
      - name: Attest the image inventory
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-name: ${{ steps.tested.outputs.name }}
          subject-digest: ${{ steps.tested.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-evidence-${{ matrix.arch }}
          path: |
            image.spdx.json
            image.provenance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/*.txt
          if-no-files-found: error

  publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/server" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.release-tag }}
            type=semver,pattern={{version}},value=${{ inputs.release-tag }}
          flavor: |
            latest=false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-platform tags from tested digests
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"
      - name: Verify published release tags and platforms
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          expected=""
          count=0
          mkdir -p published-images
          while IFS= read -r tag; do
            if [[ -z "$tag" ]]; then continue; fi
            manifest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')"
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' \
              <<< "$manifest" > /dev/null
            digest="$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' <<< "$manifest")"
            if [[ -z "$expected" ]]; then expected="$digest"; else test "$digest" = "$expected"; fi
            count=$((count + 1))
            printf '%s\n' "$manifest" > "published-images/${count}.json"
            printf '%s %s\n' "$tag" "$digest" | tee -a published-images/tags.txt
          done <<< "$TAGS"
          test "$count" -gt 0
          cat published-images/tags.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-server-images
          path: published-images
          if-no-files-found: error
