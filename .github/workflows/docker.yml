name: Docker
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release-tag:
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  image:
    name: Test and push ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HUSKY: "0"
      SOURCE_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build binary runtime once
        run: |
          docker build -f src/Dockerfile -t keyzori-server:test \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" .
      - name: Smoke test the image
        run: bun src/scripts/test-services.ts exec bun src/scripts/container-smoke.ts image
      - name: Verify Compose deployment
        run: bun src/scripts/compose-smoke.ts
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the tested image and record its digest
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${OWNER,,}/server"
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag keyzori-server:test "$image:$tag"
          docker push "$image:$tag"
          mkdir -p digests
          docker inspect --format '{{json .RepoDigests}}' "$image:$tag" \
            | jq -er --arg image "$image" '.[] | select(startswith($image + "@sha256:"))' \
            > "digests/${ARCH}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/*.txt
          if-no-files-found: error
      - if: always()
        run: bun src/scripts/test-services.ts stop

  publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/server" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.release-tag }}
            type=semver,pattern={{version}},value=${{ inputs.release-tag }}
          flavor: |
            latest=${{ !contains(inputs.release-tag, '-') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-platform tags from tested digests
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"
