name: Release Please

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  release:
    name: Version, tag, and release
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - id: gate
        name: Require successful CI and CodeQL runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "${RELEASE_SHA}" != "${main_sha}" ]]; then
              echo "Skipping superseded main commit ${RELEASE_SHA}; current main is ${main_sha}."
              echo "eligible=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            runs="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&event=push&per_page=100")"

            waiting=false
            for workflow in CI CodeQL; do
              status="$(jq -r --arg workflow "${workflow}" '
                [.workflow_runs[] | select(.name == $workflow)]
                | sort_by(.created_at)
                | last
                | if . == null then "missing" else "\(.status):\(.conclusion // "")" end
              ' <<<"${runs}")"

              case "${status}" in
                completed:success) ;;
                missing|queued:*|in_progress:*|requested:*|waiting:*|pending:*) waiting=true ;;
                *) echo "${workflow} is not green for ${RELEASE_SHA}: ${status}" >&2; exit 1 ;;
              esac
            done

            if [[ "${waiting}" == false ]]; then
              echo "CI and CodeQL are green for ${RELEASE_SHA}."
              echo "eligible=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if [[ "${attempt}" == 60 ]]; then
              echo "Timed out waiting for CI and CodeQL for ${RELEASE_SHA}." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Require release token
        if: steps.gate.outputs.eligible == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: test -n "${RELEASE_TOKEN}" || { echo "RELEASE_TOKEN is not configured." >&2; exit 1; }

      - name: Run Release Please
        if: steps.gate.outputs.eligible == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ secrets.RELEASE_TOKEN }}
