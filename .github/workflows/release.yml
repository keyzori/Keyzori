name: Release Please
on:
  workflow_run:
    workflows: [Server, CodeQL]
    types: [completed]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag whose binaries and Docker images should be rebuilt
        required: false
        type: string
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  v2-release-pr:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v2' && inputs.release-tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful checks for current v2
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: branch } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/v2' });
            if (context.sha !== branch.object.sha)
              throw new Error('Requested commit is no longer the current v2 head');
            for (const workflow_id of ['server.yml', 'codeql.yml']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id, head_sha: context.sha,
                branch: 'v2', event: 'push', per_page: 100
              });
              const latest = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
              if (latest?.conclusion !== 'success')
                throw new Error(`Current v2 commit has no successful ${workflow_id} checks`);
            }
      - name: Update v2 release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          target-branch: v2
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  release:
    outputs:
      sha: ${{ steps.artifacts.outputs.sha }}
      tag: ${{ steps.artifacts.outputs.tag }}
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful checks for current main
        id: gate
        if: github.event_name != 'workflow_dispatch' || inputs.release-tag == ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const requested = context.payload.workflow_run?.head_sha ?? context.sha;
            if (requested !== main.object.sha) {
              core.setOutput('eligible', 'false');
              return;
            }
            for (const workflow_id of ['server.yml', 'codeql.yml']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, head_sha: requested,
                branch: 'main', event: 'push', per_page: 100
              });
              const latest = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
              if (latest?.conclusion !== 'success') {
                core.setOutput('eligible', 'false');
                return;
              }
            }
            core.setOutput('eligible', 'true');
      - name: Require release token
        if: steps.gate.outputs.eligible == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: test -n "$RELEASE_TOKEN" || { echo 'Configure RELEASE_TOKEN for release pull requests.' >&2; exit 1; }
      - name: Update release pull request or create release
        id: release
        if: steps.gate.outputs.eligible == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Verify the exact released commit
        id: artifacts
        if: steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release-tag != '')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || inputs.release-tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: `tags/${tag}` });
            const sha = commit.sha;
            if (process.env.RELEASE_SHA && process.env.RELEASE_SHA !== sha)
              throw new Error('Release commit does not match its tag');
            for (const workflow_id of ['server.yml', 'codeql.yml']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id, head_sha: sha,
                branch: 'main', event: 'push', per_page: 100
              });
              const latest = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
              if (latest?.conclusion !== 'success')
                throw new Error(`Released commit has no successful ${workflow_id} checks`);
            }
            core.setOutput('sha', sha);
            core.setOutput('tag', tag);

  binaries:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.release.outputs.sha }}

  assets:
    needs: [release, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Attach binaries, checksums and API reference
        working-directory: release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          sha256sum keyzori-*.tar.gz keyzori-*.zip openapi.json > SHA256SUMS
          gh release upload "$RELEASE_TAG" keyzori-*.tar.gz keyzori-*.zip openapi.json SHA256SUMS --clobber

  docker:
    needs: [release, assets]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.release.outputs.sha }}
      release-tag: ${{ needs.release.outputs.tag }}
