name: Release Please
on:
  workflow_run:
    workflows: [Server, CodeQL]
    types: [completed]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing draft release tag whose publication should be completed
        required: false
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  release:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      sha: ${{ steps.artifacts.outputs.sha }}
      tag: ${{ steps.artifacts.outputs.tag }}
      release-id: ${{ steps.artifacts.outputs.release-id }}
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful checks for current main
        id: gate
        if: github.event_name != 'workflow_dispatch' || inputs.release-tag == ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const requested = context.payload.workflow_run?.head_sha ?? context.sha;
            if (requested !== main.object.sha) {
              core.setOutput('eligible', 'false');
              return;
            }
            for (const workflow_id of ['server.yml', 'codeql.yml']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, head_sha: requested,
                branch: 'main', event: 'push', per_page: 100
              });
              const latest = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
              if (latest?.conclusion !== 'success') {
                core.setOutput('eligible', 'false');
                return;
              }
            }
            core.setOutput('eligible', 'true');
      - name: Require release token
        if: steps.gate.outputs.eligible == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: test -n "$RELEASE_TOKEN" || { echo 'Configure RELEASE_TOKEN for release pull requests.' >&2; exit 1; }
      - name: Update release pull request or create release
        id: release
        if: steps.gate.outputs.eligible == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Verify the draft and exact release commit
        id: artifacts
        if: steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release-tag != '')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || inputs.release-tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            // GitHub's get-by-tag endpoint only returns published releases.
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const matches = releases.filter(release => release.tag_name === tag);
            if (matches.length !== 1)
              throw new Error('Expected exactly one release for the requested tag');
            const release = matches[0];
            if (!release.draft || release.immutable)
              throw new Error('Only draft releases can receive publication artifacts; published immutable releases require a new version');
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: `tags/${tag}` });
            const sha = commit.sha;
            if (process.env.RELEASE_SHA && process.env.RELEASE_SHA !== sha)
              throw new Error('Release commit does not match its tag');
            // Recovery follows the current publication contract, never a legacy binary build.
            const readJson = async path => {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: sha });
              if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64')
                throw new Error(`Missing release contract file: ${path}`);
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            };
            const contract = await readJson('.github/release-contract.json');
            const manifest = await readJson('package.json');
            if (contract.schemaVersion !== 1 || contract.distribution !== 'keyzori-bun-source-v3' ||
                contract.major !== 3 || !/^3\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(manifest.version) ||
                tag !== `v${manifest.version}` ||
                JSON.stringify(contract.assets?.slice().sort()) !== JSON.stringify(['LICENSE', 'SHA256SUMS', 'openapi.json']) ||
                JSON.stringify(contract.container?.platforms?.slice().sort()) !== JSON.stringify(['linux/amd64', 'linux/arm64']) ||
                contract.container?.sbom !== 'spdx-json' ||
                contract.container?.provenance !== 'https://slsa.dev/provenance/v1')
              throw new Error('Draft is incompatible with the v3 source/container publication contract');
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const { data: ancestry } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${sha}...${main.object.sha}`
            });
            if (ancestry.base_commit.sha !== sha || !['ahead', 'identical'].includes(ancestry.status))
              throw new Error('Release revision is not an ancestor of main');
            for (const workflow_id of ['server.yml', 'codeql.yml']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id, head_sha: sha,
                branch: 'main', event: 'push', per_page: 100
              });
              const latest = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
              if (latest?.conclusion !== 'success')
                throw new Error(`Released commit has no successful ${workflow_id} checks`);
            }
            core.setOutput('sha', sha);
            core.setOutput('tag', tag);
            core.setOutput('release-id', release.id);

  assets:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: HUSKY=0 bun install --frozen-lockfile
      - run: bun run openapi
      - name: Prepare reference assets
        run: |
          mkdir -p release-artifacts
          cp dist/server/openapi.json LICENSE release-artifacts/
          cd release-artifacts
          sha256sum openapi.json LICENSE > SHA256SUMS
      - name: Attach checksums, license and API reference
        working-directory: release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" openapi.json LICENSE SHA256SUMS --clobber

  docker:
    needs: [release, assets]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      ref: ${{ needs.release.outputs.sha }}
      release-tag: ${{ needs.release.outputs.tag }}

  publish:
    needs: [release, assets, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the complete release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.release.outputs.release-id }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            if (!release.draft || release.immutable || release.tag_name !== process.env.RELEASE_TAG)
              throw new Error('Release must remain an unpublished draft until artifacts are complete');
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: `tags/${release.tag_name}` });
            if (commit.sha !== process.env.RELEASE_SHA)
              throw new Error('Release tag changed during publication');
            const expected = ['openapi.json', 'LICENSE', 'SHA256SUMS'].sort();
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id, per_page: 100 });
            if (JSON.stringify(assets.map(asset => asset.name).sort()) !== JSON.stringify(expected) ||
                assets.some(asset => asset.state !== 'uploaded' || asset.size <= 0))
              throw new Error('Release does not contain every completed reference, license and checksum asset');
            const { data: published } = await github.rest.repos.updateRelease({
              ...context.repo, release_id, draft: false,
              make_latest: 'false'
            });
            if (published.draft)
              throw new Error('GitHub did not publish the release');
            await core.summary.addLink('Published release', published.html_url).write();
