name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  IMAGE_NAME: ghcr.io/keyzori/server
  KEYZORI_DATABASE_URL: postgresql://keyzori:keyzori-release-password@127.0.0.1:5432/keyzori
  KEYZORI_REDIS_URL: redis://127.0.0.1:6379
  KEYZORI_ADMIN_PASS: release-only-admin-password

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Require release token
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: test -n "${RELEASE_TOKEN}" || { echo "RELEASE_TOKEN is not configured." >&2; exit 1; }

      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ secrets.RELEASE_TOKEN }}

  docker:
    name: Publish Docker image
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keyzori
          POSTGRES_USER: keyzori
          POSTGRES_PASSWORD: keyzori-release-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyzori -d keyzori"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Resolve image metadata
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq --raw-output '.version' package.json)
          release_tag="v${version}"
          stable=false

          if git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}" >/dev/null; then
            tag_commit=$(git rev-parse "refs/tags/${release_tag}^{commit}")
            if [[ "${tag_commit}" == "${GITHUB_SHA}" ]] && gh release view "${release_tag}" >/dev/null 2>&1; then
              stable=true
            fi
          fi

          if [[ "${stable}" == "true" ]]; then
            image_version="${version}"
            bun run release:verify -- "${release_tag}"
          else
            image_version="canary.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA::12}"
            bun run release:verify
          fi

          echo "stable=${stable}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release-tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "image-version=${image_version}" >> "${GITHUB_OUTPUT}"
          echo "candidate=keyzori-server:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        shell: bash
        run: |
          docker build \
            --file Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${{ steps.image.outputs.image-version }}" \
            --tag "${{ steps.image.outputs.candidate }}" \
            .

      - name: Report image size
        shell: bash
        run: |
          candidate_size=$(docker image inspect --format '{{.Size}}' "${{ steps.image.outputs.candidate }}")
          echo "Image size: $(numfmt --to=iec-i --suffix=B "${candidate_size}")" >> "${GITHUB_STEP_SUMMARY}"

      - name: Smoke-test image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.candidate }}"
          image_user=$(docker image inspect --format '{{.Config.User}}' "${image}")
          case "${image_user}" in
            ""|0|0:*|root|root:*) echo "Image must declare a non-root user." >&2; exit 1 ;;
          esac
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "${image}")" = "/app/keyzori"
          test "$(docker image inspect --format '{{index .Config.Cmd 0}}' "${image}")" = "serve"
          docker run --rm "${image}" admin --help >/dev/null

          server=$(docker run \
            --detach \
            --network host \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env KEYZORI_DATABASE_URL \
            --env KEYZORI_REDIS_URL \
            --env KEYZORI_ADMIN_PASS \
            "${image}")
          trap 'docker rm --force "${server}" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "${server}" | grep --quiet true; then
              docker logs "${server}"
              exit 1
            fi
            if [[ "${attempt}" == "60" ]]; then
              docker logs "${server}"
              echo "Container did not become ready within 60 seconds." >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/docs/openapi.json >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)" = "404"
          docker run --rm --network host "${image}" healthcheck

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.image.outputs.candidate }}"
          tags=(canary)

          if [[ "${{ steps.image.outputs.stable }}" == "true" ]]; then
            tags+=(
              latest
              "${{ steps.image.outputs.version }}"
              "${{ steps.image.outputs.release-tag }}"
            )
          fi

          for tag in "${tags[@]}"; do
            docker tag "${candidate}" "${IMAGE_NAME}:${tag}"
            docker push "${IMAGE_NAME}:${tag}"
          done
