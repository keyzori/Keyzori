name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - id: source
        name: Validate tag and pin immutable commit
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}" origin/main
          bun run release:verify "${RELEASE_TAG}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
  checks:
    needs: source
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
  docker:
    name: Publish release image
    needs: [source, checks]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: write
      packages: write
    with:
      ref: ${{ needs.source.outputs.sha }}
      release_tag: ${{ needs.source.outputs.tag }}
      publish: true
