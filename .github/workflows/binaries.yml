name: Server binaries
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: windows-x64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HUSKY: "0"
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the build revision before checkout
        id: trust
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_REVISION: ${{ inputs.ref }}
        with:
          script: |
            const revision = process.env.REQUESTED_REVISION;
            if (!/^[a-f0-9]{40}$/.test(revision))
              throw new Error('Builds require an immutable commit SHA');
            // CI may build its triggering commit; recovery builds must already be on main.
            if (revision !== context.sha) {
              const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${revision}...${main.object.sha}`
              });
              if (data.base_commit.sha !== revision || !['ahead', 'identical'].includes(data.status))
                throw new Error('Build revision is not an ancestor of main');
            }
            core.setOutput('revision', revision);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trust.outputs.revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run build:verify "$TARGET"
      - name: Smoke test native binary
        run: |
          binary="keyzori-${TARGET}"
          if [[ "$TARGET" == windows-* ]]; then binary+=".exe"; fi
          expected="$(bun -p 'require("./package.json").version')"
          cd dist/server
          test "$(./"$binary" --version)" = "$expected"
      - name: Smoke test Linux runtime
        if: runner.os == 'Linux'
        run: bun src/scripts/test-services.ts exec bun src/scripts/container-smoke.ts "$TARGET"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -C dist/server -czf "dist/server/keyzori-${TARGET}.tar.gz" "keyzori-${TARGET}"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath "dist/server/keyzori-$env:TARGET.exe" -DestinationPath "dist/server/keyzori-$env:TARGET.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/server/keyzori-*.tar.gz
            dist/server/keyzori-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target == 'linux-x64'
        with:
          name: release-openapi
          path: dist/server/openapi.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - if: always() && runner.os == 'Linux'
        run: bun src/scripts/test-services.ts stop

  checksums:
    name: Verify packaged artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Prepare release checksums
        working-directory: release-artifacts
        run: |
          sha256sum keyzori-linux-x64.tar.gz keyzori-linux-arm64.tar.gz \
            keyzori-darwin-x64.tar.gz keyzori-darwin-arm64.tar.gz \
            keyzori-windows-x64.zip openapi.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: release-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
