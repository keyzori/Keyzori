name: Cleanup PR branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: github.event.pull_request.merged == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != github.event.repository.default_branch
    name: Delete closed PR branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          encoded_ref="$(jq -rn --arg ref "${HEAD_REF}" '$ref | @uri')"
          gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${encoded_ref}"
