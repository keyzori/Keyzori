name: Promote

# Prepares a release from `dev`.
#
# Trigger it either by landing a commit on `dev` whose message contains a
# release directive (`release: patch`, `[release: minor]`, `release: v1.2.0`),
# or by dispatching this workflow with an explicit bump. The job bumps every
# workspace manifest, runs the full verification gate, commits the bump to
# `dev`, and opens an auto-merging `dev -> main` pull request. Tagging is left
# to `tag.yml`, which fires once that pull request lands.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      bump:
        description: Release bump to apply (major, minor, patch, or an explicit X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  promote:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint release app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Configure release identity
        env:
          RELEASE_APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name "${RELEASE_APP_SLUG}[bot]"
          git config user.email "${RELEASE_APP_SLUG}[bot]@users.noreply.github.com"

      - name: Prepare release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_BUMP:-}" ]; then
            bun run scripts/release.ts "${RELEASE_BUMP}"
          else
            bun run scripts/release.ts --from-commit
          fi
